<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -36 1422 992" width="1422" height="992"><style>
text{font-family:Helvetica, Arial, sans-serif;font-size:12px;fill:#111418;dominant-baseline:auto}
.d-mono{font-family:Menlo, Consolas, monospace;font-size:11px;fill:#2d343c}
.d-name{font-family:Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.04em}
.d-italic{font-style:italic}
.d-comp{font-size:10.5px;font-style:italic;fill:#5b6470}
.d-frame{fill:none;stroke:#111418;stroke-width:1}
.d-frame-tab{fill:#ffffff;stroke:#111418;stroke-width:1}
.d-sym .d-shape{fill:#f4f8fd;stroke:#111418}
.d-sym .d-rule,.d-sym .d-stick{stroke:#111418}
.d-sym.c-b .d-shape{fill:#fdf8ee;stroke:#111418}
.d-sym.c-b .d-rule,.d-sym.c-b .d-stick{stroke:#111418}
.d-sym.c-c .d-shape{fill:#fbf3f6;stroke:#111418}
.d-sym.c-c .d-rule,.d-sym.c-c .d-stick{stroke:#111418}
.d-sym.c-n .d-shape{fill:#fffbe6;stroke:#5b6470}
.d-sym.c-n .d-rule,.d-sym.c-n .d-stick{stroke:#5b6470}
.d-shape{stroke-width:1.2}
.d-shape.dashed{stroke-dasharray:6 4}
.d-rule{stroke-width:.8;opacity:.55;fill:none}
.d-stick{fill:none;stroke-width:1.5}
.d-port{fill:#ffffff;stroke:#111418;stroke-width:1.2}
.d-port-dir{fill:#111418;stroke:none}
.d-line{fill:none;stroke:#2d343c;stroke-width:1.2}
.d-line.dashed{stroke-dasharray:6 4}
.d-head{fill:none;stroke:#2d343c;stroke-width:1.2}
.d-head.filled{fill:#2d343c}
.d-head.hollow{fill:#ffffff}
.d-hit{fill:none;stroke:transparent;stroke-width:12}
.d-label-bg{fill:#ffffff;opacity:.85}
</style><rect x="-26" y="-36" width="1422" height="992" fill="#fff"/><rect class="d-frame" x="-10" y="-20" width="1390" height="960"/><path class="d-frame-tab" d="M-10 -20h272.2v14l-10 10H-10z"/><text class="d-mono" x="0" y="-4">req [package] Principles [Principles]</text><g class="d-symbols"><g class="d-sym c-b" data-sym="sy_062" transform="translate(40 40)"><rect class="d-shape" width="302" height="136"/><text class="d-mono" x="151" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="151" y="36" text-anchor="middle">An element exists once</text><path class="d-rule" d="M0 46H302"/><text x="10" y="64">id = &quot;SM1&quot;</text><text x="10" y="80">text = &quot;An element shall exist once, in the</text><text x="10" y="96">containment tree; diagrams hold symbols that</text><text x="10" y="112">point at it. Rename it and every diagram, table</text><text x="10" y="128">and matrix follows.&quot;</text></g><g class="d-sym c-b" data-sym="sy_063" transform="translate(370 40)"><rect class="d-shape" width="300" height="136"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">Structure is never drawn twice</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;SM2&quot;</text><text x="10" y="80">text = &quot;Composition, reference and</text><text x="10" y="96">containment shall be derived from part</text><text x="10" y="112">properties, reference properties and</text><text x="10" y="128">ownership, never stored as edges.&quot;</text></g><g class="d-sym c-b" data-sym="sy_064" transform="translate(700 40)"><rect class="d-shape" width="300" height="120"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">The core runs without a DOM</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;SM3&quot;</text><text x="10" y="80">text = &quot;model/ and io/ shall not touch the</text><text x="10" y="96">DOM, so the tests — and a later command-line</text><text x="10" y="112">tool — run them under Node.&quot;</text></g><g class="d-sym c-b" data-sym="sy_065" transform="translate(1030 40)"><rect class="d-shape" width="300" height="104"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">Stable check codes</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;SM4&quot;</text><text x="10" y="80">text = &quot;Every check shall carry a stable code,</text><text x="10" y="96">listed in RULES and printed by Help.&quot;</text></g><g class="d-sym c-b" data-sym="sy_066" transform="translate(40 560)"><rect class="d-shape" width="300" height="120"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">Repair, or refuse with a reason</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;SM5&quot;</text><text x="10" y="80">text = &quot;Loading shall repair what it can and</text><text x="10" y="96">report it, and refuse what it cannot with a</text><text x="10" y="112">sentence that says why.&quot;</text></g><g class="d-sym c-b" data-sym="sy_067" transform="translate(370 560)"><rect class="d-shape" width="301" height="136"/><text class="d-mono" x="150.5" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150.5" y="36" text-anchor="middle">An unsaved edit is never overwritten</text><path class="d-rule" d="M0 46H301"/><text x="10" y="64">id = &quot;SM6&quot;</text><text x="10" y="80">text = &quot;A newer version from another device</text><text x="10" y="96">shall replace the open model only while nothing</text><text x="10" y="112">here is unsaved; otherwise both timestamps</text><text x="10" y="128">are shown and the person asked.&quot;</text></g><g class="d-sym c-b" data-sym="sy_068" transform="translate(700 560)"><rect class="d-shape" width="300" height="136"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">Round-trip through XMI</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;SM7&quot;</text><text x="10" y="80">text = &quot;A file this app wrote shall round-trip</text><text x="10" y="96">losslessly through XMI; what another tool</text><text x="10" y="112">wrote with no counterpart here shall be</text><text x="10" y="128">counted, not silently lost.&quot;</text></g><g class="d-sym " data-sym="sy_069" transform="translate(210 320)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Model repository</text></g><g class="d-sym " data-sym="sy_070" transform="translate(700 320)"><rect class="d-shape" width="170" height="50"/><text class="d-mono" x="85" y="19" text-anchor="middle">«block»</text><text class="d-name" x="85" y="36" text-anchor="middle">Layout</text></g><g class="d-sym " data-sym="sy_071" transform="translate(1030 320)"><rect class="d-shape" width="170" height="50"/><text class="d-mono" x="85" y="19" text-anchor="middle">«block»</text><text class="d-name" x="85" y="36" text-anchor="middle">Checks</text></g><g class="d-sym " data-sym="sy_072" transform="translate(470 320)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Native format</text></g><g class="d-sym " data-sym="sy_073" transform="translate(370 840)"><rect class="d-shape" width="170" height="50"/><text class="d-mono" x="85" y="19" text-anchor="middle">«block»</text><text class="d-name" x="85" y="36" text-anchor="middle">Sync</text></g><g class="d-sym " data-sym="sy_074" transform="translate(700 840)"><rect class="d-shape" width="170" height="50"/><text class="d-mono" x="85" y="19" text-anchor="middle">«block»</text><text class="d-name" x="85" y="36" text-anchor="middle">XMI</text></g></g><g class="d-paths"><g class="d-path" data-path="pa_064"><path class="d-hit" d="M277 320L277 248L191 248L191 176"/><path class="d-line dashed" d="M277 320L277 248L191 248L191 176"/><path class="d-head" transform="translate(191 176) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="200.3" y="230" width="67.4" height="15"/><text class="d-mono" x="234" y="241" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_065"><path class="d-hit" d="M343 320L343 248L520 248L520 176"/><path class="d-line dashed" d="M343 320L343 248L520 248L520 176"/><path class="d-head" transform="translate(520 176) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="397.8" y="230" width="67.4" height="15"/><text class="d-mono" x="431.5" y="241" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_066"><path class="d-hit" d="M785 320L785 240L900 240L900 160"/><path class="d-line dashed" d="M785 320L785 240L900 240L900 160"/><path class="d-head" transform="translate(900 160) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="808.8" y="222" width="67.4" height="15"/><text class="d-mono" x="842.5" y="233" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_067"><path class="d-hit" d="M1115 320L1115 232L1180 232L1180 144"/><path class="d-line dashed" d="M1115 320L1115 232L1180 232L1180 144"/><path class="d-head" transform="translate(1180 144) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="1121" y="269" width="67.4" height="15"/><text class="d-mono" x="1154.7" y="280" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_068"><path class="d-hit" d="M570 320L570 240L800 240L800 160"/><path class="d-line dashed" d="M570 320L570 240L800 240L800 160"/><path class="d-head" transform="translate(800 160) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="651.3" y="222" width="67.4" height="15"/><text class="d-mono" x="685" y="233" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_069"><path class="d-hit" d="M570 370L570 465L190 465L190 560"/><path class="d-line dashed" d="M570 370L570 465L190 465L190 560"/><path class="d-head" transform="translate(190 560) rotate(90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="346.3" y="447" width="67.4" height="15"/><text class="d-mono" x="380" y="458" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_070"><path class="d-hit" d="M455 840L455 768L521 768L521 696"/><path class="d-line dashed" d="M455 840L455 768L521 768L521 696"/><path class="d-head" transform="translate(521 696) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="461" y="797" width="67.4" height="15"/><text class="d-mono" x="494.7" y="808" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_071"><path class="d-hit" d="M785 840L785 768L850 768L850 696"/><path class="d-line dashed" d="M785 840L785 768L850 768L850 696"/><path class="d-head" transform="translate(850 696) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="791" y="797" width="67.4" height="15"/><text class="d-mono" x="824.7" y="808" text-anchor="middle">«satisfy»</text></g></g><g class="d-ports"></g></svg>
